[package]
name = "shiro-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
